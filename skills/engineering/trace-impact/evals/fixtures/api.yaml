openapi: 3.0.3
info: {title: Order API, version: 1.0.0}
paths:
  /v1/orders/{id}:
    get:
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string}
                  status: {type: string, enum: [PENDING, PAID]}
